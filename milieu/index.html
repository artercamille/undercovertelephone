<style>

/* Tablée : un écran = un titre, une consigne, un bouton ; chaque jeu a sa couleur. */
:root {
  --bg: #ffffff;
  --surface: #f3f3f5;
  --surface-2: #e9e9ed;
  --ink: #111114;
  --muted: #6e6e76;
  --accent: #ff5a1f;
  --accent-ink: #ffffff;
  --civil: #16a34a;
  --under: #e11d48;
  --white: #71717a;
  --font: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e0e10; --surface: #1c1c20; --surface-2: #2a2a30; --ink: #f4f4f6; --muted: #9a9aa3; --accent: #ff6a33; --civil: #34c06a; --under: #fb5172; --white: #a1a1aa; color-scheme: dark; } }
:root[data-theme="dark"] { --bg: #0e0e10; --surface: #1c1c20; --surface-2: #2a2a30; --ink: #f4f4f6; --muted: #9a9aa3; --accent: #ff6a33; --civil: #34c06a; --under: #fb5172; --white: #a1a1aa; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-weight: 500; font-size: 17px; line-height: 1.35;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
input { -webkit-user-select: text; user-select: text; }
.app { max-width: 440px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; gap: 20px;
  padding-block: 26px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.logo { text-align: center; font-size: 2.6rem; font-weight: 700; line-height: 1; }
.logo i { font-style: normal; color: var(--accent); }
h2 { margin: 0; font-size: 1.8rem; font-weight: 700; line-height: 1.12; text-align: center; text-wrap: balance; }
.sub { text-align: center; color: var(--muted); margin-top: -10px; text-wrap: balance; }
.label { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.spacer { flex: 1; }
.pop { animation: pop .3s ease-out backwards; }
@keyframes pop { from { transform: translateY(8px); opacity: 0 } }

button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
.btn { width: 100%; min-height: 60px; border-radius: 16px; background: var(--accent); color: var(--accent-ink); font-size: 1.2rem; font-weight: 600; transition: transform .08s, opacity .15s; }
.btn:active { transform: scale(.98); }
.btn.alt, .btn.soft { background: var(--surface); color: var(--ink); }
.btn:disabled { opacity: .35; }
.link { color: var(--muted); font-weight: 500; font-size: .95rem; padding: 10px; }
.links { display: flex; justify-content: center; gap: 2px; flex-wrap: wrap; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 12px; }

.box { background: var(--surface); border-radius: 18px; padding: 2px 16px; }
.line { display: flex; align-items: center; gap: 12px; min-height: 62px; }
.line + .line { border-top: 1px solid var(--surface-2); }
.line .name { flex: 1; font-weight: 600; }
.line .name small { display: block; color: var(--muted); font-size: .82rem; font-weight: 500; }
.step { display: flex; align-items: center; gap: 4px; }
.step button { width: 40px; height: 40px; border-radius: 50%; background: var(--bg); font-size: 1.3rem; font-weight: 600; }
.step button:active { transform: scale(.9); }
.step span { min-width: 54px; text-align: center; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; }
.big { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.big .step { gap: 20px; }
.big .step button { width: 56px; height: 56px; font-size: 1.7rem; background: var(--surface); }
.big .step span.count { font-size: 4.2rem; font-weight: 700; min-width: 90px; line-height: 1; }
.chips { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; margin-top: -6px; }
.chip { font-size: .88rem; font-weight: 600; padding: 4px 12px; border-radius: 99px; background: var(--surface); }
.chip.civil { color: var(--civil); } .chip.undercover { color: var(--under); } .chip.white { color: var(--white); }

/* cartes */
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.card { aspect-ratio: 3 / 4; border-radius: 16px; background: var(--accent); color: var(--accent-ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px;
  animation: pop .3s ease-out backwards; transition: transform .1s; }
.card .q { font-size: 2.4rem; font-weight: 700; line-height: 1; }
.card .num { font-size: .8rem; font-weight: 600; opacity: .8; }
.card:active { transform: scale(.95); }
.card.taken { background: var(--surface); color: var(--muted); pointer-events: none; font-weight: 600; font-size: .95rem; text-align: center; overflow-wrap: anywhere; gap: 8px; }

/* qui es-tu */
input[type=text] { width: 100%; min-height: 58px; border-radius: 16px; border: 2px solid var(--surface-2); background: var(--bg); color: var(--ink);
  font: inherit; font-size: 1.2rem; font-weight: 600; padding: 0 18px; }
input[type=text]:focus { border-color: var(--accent); outline: none; }
input::placeholder { color: var(--muted); font-weight: 500; }
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: 18px; overflow: hidden; }
.list:empty { display: none; }
.who { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 62px; padding: 8px 14px; text-align: left; }
.who + .who { border-top: 1px solid var(--surface-2); }
.who:active { background: var(--surface-2); }
.who .t { flex: 1; min-width: 0; font-weight: 600; font-size: 1.1rem; overflow-wrap: anywhere; }
.who .t small { display: block; color: var(--muted); font-weight: 500; font-size: .82rem; }
.who .go { color: var(--muted); font-size: 1.3rem; }
.who.new { background: var(--accent); color: var(--accent-ink); }
.who.new .t small, .who.new .go { color: var(--accent-ink); opacity: .85; }
.who.sel { background: var(--ink); color: var(--bg); }
.who.sel .t small, .who.sel .n { color: var(--bg); opacity: .7; }
.who .n { width: 20px; text-align: center; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.av { --c: var(--accent); width: 40px; height: 40px; flex: none; border-radius: 50%; display: grid; place-items: center;
  background: var(--c); color: #fff; font-weight: 700; font-size: 1.05rem; }
.av.dead { filter: grayscale(1); opacity: .5; }
.av.xl { width: 84px; height: 84px; font-size: 2.2rem; }
.empty { text-align: center; color: var(--muted); padding: 14px; font-size: .95rem; text-wrap: balance; }

/* révélations */
.reveal { background: var(--surface); border-radius: 24px; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
  animation: pop .3s ease-out backwards; }
.word { font-size: 2.9rem; font-weight: 700; line-height: 1.05; text-wrap: balance; max-width: 100%; }
.role { font-size: 2.9rem; font-weight: 700; line-height: 1; }
.role.civil { color: var(--civil); } .role.undercover { color: var(--under); } .role.white { color: var(--white); }
.hint { color: var(--muted); font-size: .98rem; text-wrap: balance; }
.reveal input[type=text] { text-align: center; }

/* fin + stats */
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair > div { background: var(--surface); border-radius: 18px; padding: 14px 10px; text-align: center; }
.pair b { display: block; font-size: 1.15rem; font-weight: 700; overflow-wrap: anywhere; margin-top: 2px; }
.res { display: flex; align-items: center; gap: 10px; min-height: 60px; font-variant-numeric: tabular-nums; }
.res + .res { border-top: 1px solid var(--surface-2); }
.res .t { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.res .t small { display: block; font-size: .8rem; font-weight: 600; }
.res.dead .t > span { color: var(--muted); }
.res .g { font-weight: 700; color: var(--civil); min-width: 34px; text-align: right; }
.res .win { font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); }
.r.civil { color: var(--civil); } .r.undercover { color: var(--under); } .r.white { color: var(--white); }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px 6px; text-align: center; }
.tile b { display: block; font-size: 1.7rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile span { font-size: .78rem; color: var(--muted); font-weight: 500; }
.bars { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; }
.bar { display: grid; grid-template-columns: 96px 1fr 44px; align-items: center; gap: 10px; font-size: .95rem; font-weight: 600; }
.bar .tr { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar .tr i { display: block; height: 100%; border-radius: 99px; }
.bar em { font-style: normal; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; font-size: .85rem; }
.rank { width: 22px; text-align: center; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.rank.top { color: var(--accent); }
.statcard { display: flex; flex-direction: column; align-items: center; gap: 6px; }

.sheet { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .2s; }
@keyframes fade { from { opacity: 0 } }
.sheet > div { width: min(100%, 440px); background: var(--bg); border-radius: 24px 24px 0 0; display: flex; flex-direction: column; gap: 14px; max-height: 90%; overflow-y: auto;
  animation: up .25s ease-out;
  padding: 24px max(20px, env(safe-area-inset-right, 0px)) max(22px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
@keyframes up { from { transform: translateY(40px) } }
.rules p { margin: 0 0 10px; }
.rules b { font-weight: 700; }
/* ---- couche "juste milieu" : relief, dégradés, motif sur les cartes */
:root { --accent-2: #ff2e63; --glow: rgba(255, 90, 31, .35); --shadow: 0 1px 2px rgba(20,20,30,.06), 0 8px 24px rgba(20,20,30,.08); --panel: #ffffff; --bg-2: #fff1ea; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent-2: #ff3d73; --glow: rgba(255, 106, 51, .3); --shadow: 0 8px 24px rgba(0,0,0,.45); --panel: #1c1c20; --bg-2: #22140f; } }
:root[data-theme="dark"] { --accent-2: #ff3d73; --glow: rgba(255, 106, 51, .3); --shadow: 0 8px 24px rgba(0,0,0,.45); --panel: #1c1c20; --bg-2: #22140f; }
body { background: radial-gradient(120% 60% at 50% -10%, var(--bg-2), var(--bg) 60%) fixed, var(--bg); }
.brand { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.mark { width: 74px; height: 74px; border-radius: 22px; display: grid; place-items: center; transform: rotate(-6deg);
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 26px var(--glow); }
.mark svg { width: 46px; height: 46px; }
.logo { font-size: 2.7rem; }
.logo i { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.btn { background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 20px var(--glow); }
.btn.alt, .btn.soft { background: var(--panel); box-shadow: var(--shadow); }
.btn:disabled { box-shadow: none; }
.box, .list, .pair > div, .tile { background: var(--panel); box-shadow: var(--shadow); }
.who + .who, .line + .line, .res + .res { border-top-color: var(--surface); }
.step button { background: var(--surface); }
.big .step button { background: var(--panel); box-shadow: var(--shadow); }
.big .step span.count { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.chip { background: var(--panel); box-shadow: var(--shadow); }
.card { position: relative; overflow: hidden; border-radius: 18px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.09) 0 10px, transparent 10px 20px), linear-gradient(150deg, var(--accent), var(--accent-2));
  box-shadow: 0 8px 18px var(--glow); }
.card::before { content: ""; position: absolute; inset: 6px; border-radius: 13px; border: 2px solid rgba(255,255,255,.35); pointer-events: none; }
.card .q { width: 54%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-size: 2rem; }
.card:nth-child(3n+1) { transform: rotate(-2deg); } .card:nth-child(3n) { transform: rotate(2deg); }
.card:active { transform: scale(.94); }
.card.taken { background: var(--panel); box-shadow: var(--shadow); transform: none; }
.card.taken::before { border-color: var(--surface); }
.av { background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 60%, #ff2e63)); box-shadow: 0 3px 8px color-mix(in srgb, var(--c) 35%, transparent); }
.who.new { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.who.sel { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; }
.who.sel .t small, .who.sel .n { color: #fff; }
.reveal { background: var(--panel); box-shadow: var(--shadow); position: relative; overflow: hidden; padding-top: 0; animation: flipIn .5s cubic-bezier(.2,1.2,.4,1) backwards; }
@keyframes flipIn { from { transform: perspective(900px) rotateY(70deg); opacity: 0 } }
.reveal::before { content: ""; display: block; align-self: stretch; height: 92px; margin: 0 -20px 4px;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.1) 0 10px, transparent 10px 20px), linear-gradient(150deg, var(--band1, var(--accent)), var(--band2, var(--accent-2))); }
.reveal .av.xl { margin-top: -66px; box-shadow: 0 0 0 6px var(--panel), 0 8px 18px rgba(0,0,0,.18); }
.reveal.civil { --band1: #22c55e; --band2: #0d9488; }
.reveal.undercover { --band1: #f43f5e; --band2: #be123c; }
.reveal.white { --band1: #a1a1aa; --band2: #52525b; }
.reveal.wordcard .word { background: linear-gradient(135deg, var(--ink), color-mix(in srgb, var(--ink) 60%, var(--accent))); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: 4px; }
.res .win { background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
.tile b { background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.endhead { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 20px 16px; border-radius: 24px; color: #fff; text-align: center;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.1) 0 10px, transparent 10px 20px), linear-gradient(150deg, var(--band1, var(--accent)), var(--band2, var(--accent-2)));
  box-shadow: var(--shadow); animation: pop .4s ease-out backwards; }
.endhead.civils { --band1: #22c55e; --band2: #0d9488; } .endhead.imposteurs { --band1: #f43f5e; --band2: #be123c; } .endhead.white { --band1: #71717a; --band2: #3f3f46; }
.endhead h2 { color: #fff; }
.endhead .label { color: rgba(255,255,255,.85); }
.sheet > div { background: var(--bg); }
canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---- Juste Milieu : bleu ciel vers indigo ; le cadran est l'objet central */
:root { --accent: #0ea5e9; --accent-2: #6366f1; --glow: rgba(14, 165, 233, .3); --bg-2: #e9f6ff; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --accent: #38bdf8; --accent-2: #818cf8; --glow: rgba(56, 189, 248, .25); --bg-2: #0d1a2b; } }
:root[data-theme="dark"] { --accent: #38bdf8; --accent-2: #818cf8; --glow: rgba(56, 189, 248, .25); --bg-2: #0d1a2b; }
/* ---- éléments communs aux nouveaux jeux */
.endhead.main { --band1: var(--accent); --band2: var(--accent-2); }
.reveal.main { --band1: var(--accent); --band2: var(--accent-2); }
.place-name { font-size: 2.2rem; font-weight: 700; line-height: 1.08; text-wrap: balance; max-width: 100%; }
.teambox { background: var(--panel); box-shadow: var(--shadow); border-radius: 20px; overflow: hidden; }
.teamhead { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 16px; color: #fff; font-weight: 700; font-size: 1.1rem;
  background: repeating-linear-gradient(45deg, rgba(255,255,255,.1) 0 10px, transparent 10px 20px), linear-gradient(135deg, var(--band1, var(--accent)), var(--band2, var(--accent-2))); }
.teamhead small { font-weight: 600; opacity: .9; font-size: .85rem; }
.chips2 { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
.pchip { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border-radius: 99px; background: var(--surface); font-weight: 600; font-size: .98rem; }
.pchip .av { width: 30px; height: 30px; font-size: .85rem; }
.pchip i { font-style: normal; color: var(--muted); font-size: 1.2rem; margin-left: 2px; }
.pchip.add { padding: 0 16px; min-height: 38px; color: var(--accent); background: transparent; box-shadow: inset 0 0 0 2px var(--surface-2); }
.res .tot { font-weight: 700; font-size: 1.25rem; min-width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
.tdot { width: 22px; height: 22px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--band1), var(--band2)); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.two .btn { font-size: 1.05rem; min-height: 56px; }
.toggle { width: 100%; text-align: left; }
.toggle .name { flex: 1; }
.sw { width: 48px; height: 28px; border-radius: 99px; background: var(--surface-2); position: relative; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
.sw.on { background: var(--accent); } .sw.on::after { transform: translateX(20px); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 6px; background: var(--surface); border-radius: 14px; padding: 4px; }
.seg button { min-height: 44px; border-radius: 11px; font-weight: 600; color: var(--muted); padding: 0 6px; }
.seg button.on { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 4px 12px var(--glow); }
.rolebox { background: var(--surface); border-radius: 14px; padding: 10px 16px; font-weight: 600; }
.rolebox small { display: block; color: var(--muted); font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; }
.clock { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 16px; }
.clock b { font-size: 3.4rem; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums;
  background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.clock.low b { background: none; color: var(--under); animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: .4 } }
.clock .row { display: flex; gap: 8px; margin-top: 8px; }
.clock .row button { padding: 8px 16px; border-radius: 99px; background: var(--surface); font-weight: 600; font-size: .95rem; }

.dialbox { background: var(--panel); box-shadow: var(--shadow); border-radius: 24px; padding: 16px 12px 12px; }
.dial { width: 100%; height: auto; display: block; touch-action: none; }
.dial.drag { cursor: grab; }
.dial .face { fill: var(--surface); stroke: var(--surface-2); stroke-width: 2; }
.dial .needle { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.dial .hub { fill: var(--ink); }
.dial .zl { font: 700 9px var(--font); fill: #fff; }
.ends { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-weight: 700; font-size: 1.05rem; }
.ends span:last-child { text-align: right; }
.reveal-dial { animation: pop .4s ease-out; }
.scorebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; font-weight: 600; }
.scorebar .sc { padding: 6px 14px; border-radius: 99px; background: var(--surface); color: var(--muted); }
.scorebar .sc.on { color: #fff; background: linear-gradient(135deg, var(--band1), var(--band2)); }
.scorebar .sc b { margin-left: 4px; }
.scorebar .goal { color: var(--muted); font-size: .85rem; }
.scorebar b { font-variant-numeric: tabular-nums; }
.rules p { margin: 0 0 10px; }

</style>
<style>
@font-face { font-family: "Fredoka"; src: url("../Fredoka.ttf") format("truetype"); font-weight: 300 700; font-display: swap; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { overscroll-behavior: none; }
body.full { overflow: hidden; }
.backmenu { align-self: flex-start; color: var(--muted); font-weight: 600; text-decoration: none; padding: 6px 2px; margin-bottom: -12px; }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="sheet"></div>
<script>
// ---------- outils communs à tous les jeux Tablée
const BODY = ["#3b5bff", "#ff5a1f", "#16a34a", "#9333ea", "#db2777", "#0891b2", "#ca8a04", "#4f46e5", "#ea580c", "#0d9488"];
const NAME_KEYS = ["auracover_poche5", "auraspy1", "auratime1", "auratete1", "auraloup2", "auraapero1", "tablee_milieu", "tablee_codes", "tablee_preferes", "tablee_artiste", "tablee_motcache"];
const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} };
const fold = s => (s || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").trim();
function seedOf(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const av = (nm, cls = "") => `<span class="av ${cls}" style="--c:${BODY[seedOf(nm || "?") % BODY.length]}" aria-hidden="true">${esc((nm.trim()[0] || "?").toUpperCase())}</span>`;
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = n => Math.random() * n | 0;
function knownNames(own) {
  const set = new Set(Object.keys(own || {}));
  for (const k of NAME_KEYS) try { const c = JSON.parse(localStorage.getItem(k) || "{}"); for (const n of Object.keys(c.people || {})) set.add(n); } catch (e) {}
  return [...set];
}
// liste « qui es-tu ? » : prénoms connus filtrés + « nouveau joueur »
function nameList(q, exclude, people, act) {
  const f = fold(q), all = knownNames(people), used = new Set(exclude);
  const list = all.filter(n => !used.has(n) && fold(n).includes(f)).sort((a, b) => ((people[b] || {}).last || 0) - ((people[a] || {}).last || 0) || a.localeCompare(b)).slice(0, 30);
  const exact = all.some(n => fold(n) === f) || [...used].some(n => fold(n) === f);
  let h = list.map(n => `<button class="who" data-a="${act}" data-v="${esc(n)}">${av(n)}<span class="t">${esc(n)}</span><span class="go">＋</span></button>`).join("");
  if (q.trim() && !exact) h = `<button class="who new" data-a="${act}" data-v="${esc(q.trim().slice(0, 16))}">${av(q.trim())}<span class="t">${esc(q.trim())}<small>Nouveau joueur</small></span><span class="go">＋</span></button>` + h;
  return h || `<div class="empty">Écris un prénom, le jeu s'en souviendra.</div>`;
}
const exactName = (v, people) => knownNames(people).find(n => fold(n) === fold(v)) || v.slice(0, 16);
function confetti() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let c = document.getElementById("fx"); if (!c) { c = document.createElement("canvas"); c.id = "fx"; document.body.appendChild(c); }
  const x = c.getContext("2d"), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.setTransform(dpr, 0, 0, dpr, 0, 0);
  const P = [...Array(130)].map(() => ({ x: innerWidth / 2 + (Math.random() - .5) * 80, y: innerHeight * .3, vx: (Math.random() - .5) * 13, vy: -Math.random() * 14 - 4,
    w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, a: Math.random() * 6, va: (Math.random() - .5) * .4, c: BODY[Math.random() * BODY.length | 0] }));
  const t0 = performance.now(), W = innerWidth, H = innerHeight;
  (function f(t) {
    if (innerWidth !== W || innerHeight !== H) { c.width = c.width; return; }
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of P) { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += p.va;
      x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); x.restore(); }
    if (t - t0 < 3200) requestAnimationFrame(f); else x.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}
let wakeLock = null;
async function wake() { try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => wakeLock = null); } } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") wake(); });
const step = (act, val, cls = "") => `<div class="step"><button data-a="${act}" data-v="-1" aria-label="Moins">−</button><span class="${cls}">${val}</span><button data-a="${act}" data-v="1" aria-label="Plus">+</button></div>`;

const SPECTRES = [["Froid", "Chaud"], ["Nul", "Génial"], ["Inutile", "Indispensable"], ["Sous-coté", "Surcoté"], ["Facile", "Difficile"], ["Moche", "Beau"],
  ["Triste", "Joyeux"], ["Calme", "Bruyant"], ["Pas cher", "Hors de prix"], ["Ringard", "Stylé"], ["Bon pour la santé", "Mauvais pour la santé"], ["Minuscule", "Énorme"],
  ["Rare", "Partout"], ["Mou", "Dur"], ["Lent", "Rapide"], ["Fragile", "Indestructible"], ["Mauvais film", "Chef-d'œuvre"], ["Odeur horrible", "Odeur délicieuse"],
  ["Ennuyeux", "Passionnant"], ["Gentil", "Méchant"], ["Inoffensif", "Mortel"], ["Pour les enfants", "Pour les adultes"], ["Plutôt été", "Plutôt hiver"],
  ["Plutôt matin", "Plutôt soir"], ["Plutôt ville", "Plutôt campagne"], ["Sucré", "Salé"], ["Introverti", "Extraverti"], ["Rêve", "Cauchemar"],
  ["Faible", "Puissant"], ["Mauvais cadeau", "Super cadeau"], ["Super-pouvoir nul", "Super-pouvoir génial"], ["Simple", "Compliqué"], ["Vieux jeu", "Moderne"],
  ["Silencieux", "Bavard"], ["Pire chanson", "Meilleure chanson"], ["Inconnu", "Célèbre"], ["Mauvaise idée", "Bonne idée"], ["Naturel", "Artificiel"],
  ["Pas un sport", "Vrai sport"], ["Légal", "Illégal"], ["Sale", "Propre"], ["Mauvais métier", "Métier de rêve"], ["Fade", "Épicé"], ["Peu romantique", "Très romantique"],
  ["Pas effrayant", "Terrifiant"], ["Petit-déjeuner", "Dîner"], ["Mauvais prénom", "Beau prénom"], ["Mauvaise équipe", "Grande équipe"], ["Gâchis", "Bon investissement"],
  ["Bruit agréable", "Bruit insupportable"], ["Facile à dessiner", "Impossible à dessiner"], ["Mauvais acteur", "Grand acteur"], ["Pas drôle", "Hilarant"],
  ["Mauvaise habitude", "Bonne habitude"], ["Personne normale", "Personne bizarre"], ["Discret", "Voyant"], ["Pire animal de compagnie", "Meilleur animal de compagnie"],
  ["Mauvais jeu vidéo", "Jeu culte"], ["Pas sexy", "Très sexy"], ["Liquide", "Solide"], ["Rond", "Pointu"], ["Lourd", "Léger"], ["Sombre", "Lumineux"],
  ["Pas fatigant", "Épuisant"], ["Mauvais endroit pour un date", "Endroit parfait pour un date"], ["Démodé", "Tendance"], ["Débile", "Génie"],
  ["Mauvais plat", "Plat parfait"], ["Pas utile en survie", "Vital en survie"], ["Ça se partage", "Ça ne se partage pas"], ["Héros", "Méchant"],
  ["Mauvais conseil", "Bon conseil"], ["Pas cool", "Très cool"], ["Calme plat", "Chaos total"], ["Passé de mode", "Intemporel"], ["Mauvaise excuse", "Excuse parfaite"],
  ["Pas stressant", "Hyper stressant"], ["Tout le monde aime", "Tout le monde déteste"], ["Petit plaisir", "Grand bonheur"], ["Pas grave", "Très grave"]];
const TEAMS = [{ name: "Orange", c: "#f97316", c2: "#ef4444" }, { name: "Bleue", c: "#3b82f6", c2: "#6366f1" }];
const KEY = "tablee_milieu";
const MARK = `<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M6 36a18 18 0 0 1 36 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M24 36 32 18" stroke="#fff" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="36" r="4" fill="#fff"/></svg>`;

let S = { screen: "home", mode: "teams", teams: [[], []], solo: [], goal: 10, coopRounds: 7, people: {}, game: null };
function load() {
  let d = null; try { d = JSON.parse(localStorage.getItem(KEY) || "null"); } catch (e) {}
  if (d) for (const k of Object.keys(S)) if (d[k] !== undefined) S[k] = d[k];
  if (!S.game && !["home"].includes(S.screen)) S.screen = "home";
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function person(nm) { return S.people[nm] || (S.people[nm] = { games: 0, wins: 0, last: 0 }); }
const ready = () => S.mode === "teams" ? S.teams.every(t => t.length >= 2) : S.solo.length >= 2;

function newGame() {
  const g = { deck: shuffle(SPECTRES.map((_, i) => i)), team: rnd(2), spk: [rnd(9), rnd(9)], soloSpk: rnd(9), score: [0, 0], coop: 0, round: 0,
    card: null, target: 50, needle: 50, side: null, ended: false, last: null };
  S.game = g; nextRound();
}
function nextRound() {
  const g = S.game; g.round++;
  if (!g.deck.length) g.deck = shuffle(SPECTRES.map((_, i) => i));
  g.card = g.deck.pop(); g.target = 6 + Math.random() * 88; g.needle = 50; g.side = null; g.last = null;
  go("handoff");
}
const psychic = () => { const g = S.game; if (S.mode === "teams") { const t = S.teams[g.team]; return t[g.spk[g.team] % t.length]; } return S.solo[g.soloSpk % S.solo.length]; };
function points(d) { d = Math.abs(d); return d <= 3 ? 4 : d <= 8 ? 3 : d <= 13 ? 2 : 0; }
function resolve() {
  const g = S.game, d = g.needle - g.target, pts = points(d);
  const res = { pts, other: 0, d };
  if (S.mode === "teams") {
    g.score[g.team] += pts;
    if (pts < 4 && g.side) { const right = g.target > g.needle; if ((g.side === "droite") === right) { res.other = 1; g.score[1 - g.team] += 1; } }
  } else g.coop += pts;
  g.last = res; go("reveal"); if (pts >= 3) buzz([40, 60, 40]);
}
function afterReveal() {
  const g = S.game;
  if (S.mode === "teams") {
    const w = [0, 1].filter(t => g.score[t] >= S.goal);
    if (w.length) { finish(g.score[0] === g.score[1] ? -1 : g.score[0] > g.score[1] ? 0 : 1); return; }
    g.spk[g.team]++; g.team = 1 - g.team;
  } else { g.soloSpk++; if (g.round >= S.coopRounds) { finish(null); return; } }
  nextRound();
}
function finish(w) {
  const g = S.game; g.ended = true; g.winner = w; const now = Date.now();
  const all = S.mode === "teams" ? S.teams.flat() : S.solo;
  for (const nm of all) { const p = person(nm); p.games++; p.last = now; }
  if (S.mode === "teams" && w !== -1 && w !== null) for (const nm of S.teams[w]) person(nm).wins++;
  go("end"); confetti();
}

// ---------- cadran
const CX = 110, CY = 112, RAD = 100;
const ang = p => Math.PI * (1 - p / 100);
const pt = (p, r = RAD) => [CX + r * Math.cos(ang(p)), CY - r * Math.sin(ang(p))];
function wedge(p1, p2, fill) {
  p1 = Math.max(0, p1); p2 = Math.min(100, p2); const [x1, y1] = pt(p1), [x2, y2] = pt(p2);
  return `<path d="M${CX} ${CY} L${x1.toFixed(1)} ${y1.toFixed(1)} A${RAD} ${RAD} 0 0 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${fill}"/>`;
}
function dial({ target = null, needle = null, drag = false }) {
  const t = target;
  const zones = t === null ? "" : [[13, "#fde68a", "2"], [8, "#fb923c", "3"], [3, "#ef4444", "4"]].map(([w, c]) => wedge(t - w, t + w, c)).join("") +
    [[-10.5, "2"], [-5.5, "3"], [0, "4"], [5.5, "3"], [10.5, "2"]].map(([o, l]) => { const p = t + o; if (p < 1 || p > 99) return ""; const [x, y] = pt(p, RAD - 14); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" class="zl">${l}</text>`; }).join("");
  const nd = needle === null ? "" : (() => { const [x, y] = pt(needle, RAD + 4); return `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="needle"/><circle cx="${CX}" cy="${CY}" r="9" class="hub"/>`; })();
  return `<svg class="dial ${drag ? "drag" : ""}" id="dial" viewBox="0 0 220 124" role="img" aria-label="Cadran">
    <path d="M${CX - RAD} ${CY} A${RAD} ${RAD} 0 0 1 ${CX + RAD} ${CY} Z" class="face"/>${zones}${nd}</svg>`;
}
const labels = c => `<div class="ends"><span>← ${esc(SPECTRES[c][0])}</span><span>${esc(SPECTRES[c][1])} →</span></div>`;
function bindDial() {
  const svg = document.getElementById("dial"); if (!svg || !svg.classList.contains("drag")) return;
  const set = e => {
    const r = svg.getBoundingClientRect(), sx = 220 / r.width, x = (e.clientX - r.left) * sx - CX, y = CY - (e.clientY - r.top) * sx;
    let a = Math.atan2(Math.max(y, 0), x); const p = Math.max(0, Math.min(100, 100 * (1 - a / Math.PI)));
    S.game.needle = p; const [nx, ny] = pt(p, RAD + 4), line = svg.querySelector(".needle"); line.setAttribute("x2", nx.toFixed(1)); line.setAttribute("y2", ny.toFixed(1));
  };
  let on = false;
  svg.addEventListener("pointerdown", e => { on = true; svg.setPointerCapture(e.pointerId); set(e); });
  svg.addEventListener("pointermove", e => { if (on) set(e); });
  svg.addEventListener("pointerup", () => { on = false; save(); buzz(8); });
}

// ---------- écrans
const app = document.getElementById("app"), sheet = document.getElementById("sheet");
function go(s) { S.screen = s; save(); render(); scrollTo(0, 0); }
const band = t => `--band1:${TEAMS[t].c};--band2:${TEAMS[t].c2}`;
function render() {
  const g = S.game; let h = "";
  switch (S.screen) {
    case "home": {
      const ok = ready();
      h = `<a class="backmenu" href="../">‹ Menu</a><div class="brand"><span class="mark">${MARK}</span><div class="logo">Juste <i>Milieu</i></div></div>
        <div class="sub" style="margin-top:0">Un indice, un cadran : trouvez où il pense.</div>
        <div class="seg"><button class="${S.mode === "teams" ? "on" : ""}" data-a="mode" data-v="teams">2 équipes</button><button class="${S.mode === "coop" ? "on" : ""}" data-a="mode" data-v="coop">Tous ensemble</button></div>
        ${S.mode === "teams" ? [0, 1].map(t => `<div class="teambox" style="${band(t)}"><div class="teamhead"><span>Équipe ${TEAMS[t].name}</span><small>${plural(S.teams[t].length, "joueur")}</small></div>
          <div class="chips2">${S.teams[t].map((nm, k) => `<button class="pchip" data-a="rm" data-v="${t}:${k}">${av(nm)}<span>${esc(nm)}</span><i>×</i></button>`).join("")}<button class="pchip add" data-a="add" data-v="${t}">+ Ajouter</button></div></div>`).join("")
          + `<button class="btn soft" data-a="mix">Mélanger les équipes</button>`
          : `<div class="teambox"><div class="teamhead"><span>Les joueurs</span><small>${S.solo.length}</small></div>
          <div class="chips2">${S.solo.map((nm, k) => `<button class="pchip" data-a="rm" data-v="s:${k}">${av(nm)}<span>${esc(nm)}</span><i>×</i></button>`).join("")}<button class="pchip add" data-a="add" data-v="s">+ Ajouter</button></div></div>`}
        <div class="box"><div class="line"><div class="name">${S.mode === "teams" ? "Points pour gagner" : "Nombre de manches"}</div>${step("goal", S.mode === "teams" ? S.goal : S.coopRounds)}</div></div>
        <div class="spacer"></div>
        <button class="btn" data-a="play" ${ok ? "" : "disabled"}>${ok ? "Jouer" : S.mode === "teams" ? "Il faut 2 joueurs par équipe" : "Il faut au moins 2 joueurs"}</button>
        ${g && !g.ended ? `<button class="btn soft" data-a="resume">Reprendre la partie</button>` : ""}
        <div class="links"><button class="link" data-a="rules">Règles</button><a class="link" href="../" style="text-decoration:none">‹ Menu</a></div>`;
      break;
    }
    case "handoff": {
      const p = psychic();
      h = `${scoreBar()}
        <div class="spacer"></div>
        <div class="reveal main" style="${S.mode === "teams" ? band(g.team) : ""}">${av(p, "xl")}
          <div class="label">${S.mode === "teams" ? `Équipe ${TEAMS[g.team].name} · ` : ""}Manche ${g.round}</div>
          <div class="place-name">${esc(p)} est le médium</div>
          <div class="hint">Toi seul regardes l'écran : tu vas voir où se cache la cible.</div></div>
        <div class="spacer"></div>
        <button class="btn" data-a="see">Je suis ${esc(p)}, montre-moi</button>
        <div class="links"><button class="link" data-a="skipP">Changer de médium</button><button class="link" data-a="home">Pause</button></div>`;
      break;
    }
    case "psychic": {
      h = `<div class="label" style="text-align:center">La cible · ne montre à personne</div>
        <div class="dialbox">${dial({ target: g.target })}${labels(g.card)}</div>
        <div class="rolebox" style="text-align:center"><small>Ta mission</small>Trouve un indice qui se place à cet endroit, entre « ${esc(SPECTRES[g.card][0])} » et « ${esc(SPECTRES[g.card][1])} ».</div>
        <div class="hint" style="text-align:center">Par exemple, pour Froid ↔ Chaud un peu à droite : « une douche tiède ».</div>
        <div class="spacer"></div>
        <button class="btn" data-a="hide">J'ai mon indice, je cache</button>`;
      break;
    }
    case "guess": {
      h = `${scoreBar()}
        <h2>${S.mode === "teams" ? `Équipe ${TEAMS[g.team].name}, à vous !` : "À vous !"}</h2>
        <div class="sub">${esc(psychic())} dit son indice. Déplacez l'aiguille, débattez, puis validez.</div>
        <div class="dialbox">${dial({ needle: g.needle, drag: true })}${labels(g.card)}</div>
        <div class="spacer"></div>
        <button class="btn" data-a="lock">On valide</button>`;
      break;
    }
    case "side": {
      const o = 1 - g.team;
      h = `${scoreBar()}
        <h2>Équipe ${TEAMS[o].name}, à vous</h2>
        <div class="sub">La cible est-elle plus à gauche ou plus à droite que l'aiguille ? Bonne réponse : 1 point.</div>
        <div class="dialbox">${dial({ needle: g.needle })}${labels(g.card)}</div>
        <div class="spacer"></div>
        <div class="two"><button class="btn" data-a="sideGo" data-v="gauche">← Plus à gauche</button><button class="btn" data-a="sideGo" data-v="droite">Plus à droite →</button></div>`;
      break;
    }
    case "reveal": {
      const r = g.last, msg = ["Raté…", "", "Pas mal !", "Très bien !", "En plein dans le mille !"][r.pts];
      h = `${scoreBar()}
        <div class="dialbox reveal-dial">${dial({ target: g.target, needle: g.needle })}${labels(g.card)}</div>
        <div class="reveal main" style="margin-top:0;padding-top:18px;${S.mode === "teams" ? band(g.team) : ""}">
          <div class="place-name">${r.pts ? `+${r.pts} point${r.pts > 1 ? "s" : ""}` : "0 point"}</div>
          <div class="hint">${msg}${S.mode === "teams" && g.side && r.pts < 4 ? ` · L'équipe ${TEAMS[1 - g.team].name} ${r.other ? "gagne 1 point avec son pari." : "s'est trompée de côté."}` : ""}</div></div>
        <div class="spacer"></div>
        <button class="btn" data-a="next">Manche suivante</button>`;
      break;
    }
    case "end": {
      if (S.mode === "teams") {
        const w = g.winner;
        h = `<div class="endhead main" style="${w >= 0 ? band(w) : ""}"><div class="label">Partie terminée · ${plural(g.round, "manche")}</div><h2>${w === -1 ? "Égalité !" : `L'équipe ${TEAMS[w].name} gagne !`}</h2></div>
          <div class="box">${[0, 1].map(t => `<div class="res"><span class="tdot" style="${band(t)}"></span><span class="t"><span>Équipe ${TEAMS[t].name}</span><small style="color:var(--muted)">${S.teams[t].map(esc).join(", ")}</small></span><span class="tot">${g.score[t]}</span></div>`).join("")}</div>`;
      } else {
        const max = S.coopRounds * 4, r = g.coop / max;
        const verdict = r >= .8 ? "Télépathes confirmés." : r >= .6 ? "Vous vous comprenez bien." : r >= .4 ? "Pas mal, mais il y a du boulot." : "Vous ne parlez pas la même langue…";
        h = `<div class="endhead main"><div class="label">Partie terminée</div><h2>${g.coop} points sur ${max}</h2></div>
          <div class="reveal main" style="margin-top:0;padding-top:18px"><div class="place-name">${verdict}</div></div>`;
      }
      h += `<div class="spacer"></div><button class="btn" data-a="play">Rejouer</button><div class="links"><button class="link" data-a="home">Accueil</button><a class="link" href="../" style="text-decoration:none">‹ Menu</a></div>`;
      break;
    }
  }
  app.innerHTML = h;
  bindDial();
}
function scoreBar() {
  const g = S.game;
  if (S.mode !== "teams") return `<div class="scorebar"><span>Manche ${g.round} / ${S.coopRounds}</span><b>${g.coop} pts</b></div>`;
  return `<div class="scorebar">${[0, 1].map(t => `<span class="sc ${g.team === t ? "on" : ""}" style="${band(t)}">${TEAMS[t].name} <b>${g.score[t]}</b></span>`).join("")}<span class="goal">objectif ${S.goal}</span></div>`;
}

// fenêtre d'ajout
let addTo = 0, addQ = "";
function openSheet(kind) {
  if (!kind) { sheet.innerHTML = ""; return; }
  if (kind === "rules") sheet.innerHTML = `<div class="sheet" data-a="bg"><div role="dialog" aria-modal="true"><h2>Les règles</h2><div class="rules">
    <p>À chaque manche, un <b>médium</b> regarde seul le cadran : une cible est cachée quelque part entre deux mots opposés, par exemple <b>Froid ↔ Chaud</b>.</p>
    <p>Il donne un <b>indice</b> à voix haute qui correspond à cet endroit. Plus la cible est à droite, plus l'indice doit être « chaud ».</p>
    <p>Son équipe déplace l'aiguille là où elle pense que se trouve la cible. En plein centre : 4 points, puis 3, puis 2.</p>
    <p>En mode 2 équipes, l'autre équipe parie ensuite si la cible est plus à gauche ou plus à droite que l'aiguille, pour gagner 1 point. La première équipe à l'objectif gagne.</p>
    <p>En mode tous ensemble, chacun est médium à son tour et vous additionnez vos points.</p></div><button class="btn" data-a="close">Compris</button></div></div>`;
  else {
    const excl = S.mode === "teams" ? S.teams.flat() : S.solo;
    sheet.innerHTML = `<div class="sheet" data-a="bg"><div role="dialog" aria-modal="true"><h2>${addTo === "s" ? "Ajouter des joueurs" : `Ajouter à l'équipe ${TEAMS[addTo].name}`}</h2>
      <input id="aq" type="text" maxlength="16" placeholder="Cherche ou écris un prénom" value="${esc(addQ)}" autocomplete="off" autocapitalize="words" enterkeyhint="done">
      <div class="list" id="al">${nameList(addQ, excl, S.people, "addName")}</div><button class="btn" data-a="close">OK</button></div></div>`;
    const aq = document.getElementById("aq");
    aq.oninput = () => { addQ = aq.value; document.getElementById("al").innerHTML = nameList(addQ, excl, S.people, "addName"); };
    aq.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (aq.value.trim()) addName(exactName(aq.value.trim(), S.people)); } };
  }
}
function addName(nm) {
  for (const t of S.teams) { const i = t.indexOf(nm); if (i >= 0) t.splice(i, 1); }
  const i = S.solo.indexOf(nm); if (i >= 0) S.solo.splice(i, 1);
  (addTo === "s" ? S.solo : S.teams[addTo]).push(nm); person(nm).last = Date.now(); addQ = ""; save(); render(); openSheet("add");
  const aq = document.getElementById("aq"); if (aq) aq.focus();
}

const A = {
  mode: v => { S.mode = v; if (v === "coop" && !S.solo.length) S.solo = S.teams.flat(); if (v === "teams" && S.teams.every(t => !t.length) && S.solo.length) { S.teams = [[], []]; S.solo.forEach((n, i) => S.teams[i % 2].push(n)); } save(); render(); },
  add: v => { addTo = v === "s" ? "s" : +v; addQ = ""; openSheet("add"); },
  addName: v => addName(v),
  rm: v => { const [t, k] = v.split(":"); if (t === "s") S.solo.splice(+k, 1); else S.teams[+t].splice(+k, 1); save(); render(); },
  mix: () => { const all = shuffle(S.teams.flat()); S.teams = [[], []]; all.forEach((n, i) => S.teams[i % 2].push(n)); buzz(20); save(); render(); },
  goal: d => { if (S.mode === "teams") S.goal = Math.max(5, Math.min(20, S.goal + +d)); else S.coopRounds = Math.max(3, Math.min(15, S.coopRounds + +d)); save(); render(); },
  play: () => { if (!ready()) return; wake(); newGame(); },
  resume: () => { wake(); go(S.game.last ? "reveal" : "handoff"); },
  home: () => go("home"),
  skipP: () => { const g = S.game; if (S.mode === "teams") g.spk[g.team]++; else g.soloSpk++; save(); render(); },
  see: () => { buzz(20); go("psychic"); },
  hide: () => go("guess"),
  lock: () => { buzz(30); if (S.mode === "teams") go("side"); else resolve(); },
  sideGo: v => { S.game.side = v; resolve(); },
  next: () => afterReveal(),
  rules: () => openSheet("rules"),
  close: () => openSheet(null),
  bg: (v, e) => { if (e.target.classList.contains("sheet")) openSheet(null); },
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el || el.disabled) return; const f = A[el.dataset.a]; if (f) f(el.dataset.v, e); });
load(); render();

</script>
<script>
// une seule appli : un seul service worker à la racine
if ("serviceWorker" in navigator) addEventListener("load", async () => {
  try { for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope !== new URL("../", location).href) r.unregister(); } catch (e) {}
  navigator.serviceWorker.register("../sw.js", { scope: "../" }).catch(() => {});
});
</script>
</body>
